# ── 项目案例 ──
#   category 用于首页筛选，必须是 filters 里定义过的 id
#   case 里没有 body / items / links 的小节不会渲染（见 # TODO）
projects:
  eyebrow: { zh: 项目案例, en: SELECTED WORK }
  heading: { zh: 从智能体，到撑住它的那套系统。, en: "From agents to the infrastructure that carries them." }
  lead:
    zh: 用 Java、微服务与云原生技术，打造智能体与可扩展后端系统。
    en: >-
      Building intelligent agents and scalable backend systems with Java, microservices, and cloud-native technologies.
  case_summary: { zh: 查看案例结构, en: Explore Case Structure }
  case_link: { zh: 阅读完整案例 ↗, en: Read full case ↗ }
  filters:
    - { id: all,      label: { zh: 全部,     en: All } }
    - { id: agent,    label: { zh: AI Agent, en: AI Agent } }
    - { id: platform, label: { zh: 平台与云, en: Platform & Cloud } }

  items:
    # ───────────────────────────────── 01
    - slug: bid-agent
      index: "01"
      category: [agent]
      kind:  { zh: AI Agent, en: AI Agent }
      badge: { zh: 公开项目, en: Public Project }
      title: { zh: AI 投标助手, en: AI Tender Assistant }
      blurb:
        zh: 围绕招标解析、合规审查、人工复核和报告生成构建端到端智能体流程。
        en: >-
          An end-to-end agent workflow for tender parsing, compliance
          review, human verification, and reporting.
      tags: [LangGraph, RAG, FastAPI, React]
      meta:
        org:  { zh: AI Agent / 全栈开发, en: AI Agent & Full-stack Development }
        date: { zh: Release @ 2026年7月, en: Release @ July 2026 }
      case:
        - heading: { zh: 业务问题与使用场景, en: Business problem and use cases }
          body:
            zh: 基于 LangGraph 的招投标智能体平台，覆盖招标解析、合规审查、人工复核、批量评审与横向对比，集成 OCR、法规知识库 RAG 和自动报告生成能力。
            en: >-
              A LangGraph-based bidding assistant covering tender parsing,
              compliance review, human verification, batch evaluation and
              bidder comparison, with integrated OCR, regulation-focused RAG
              and automated reporting.
        - heading: { zh: 工作流架构与关键节点, en: Workflow architecture and key nodes }
          items:
            - zh: 负责智能体架构与核心工作流设计，使用 LangGraph StateGraph 编排文件解析、要点提取、合规核查和报告生成，并通过 Human-in-the-loop 与 Checkpointer 实现人工复核、状态持久化及断点恢复。
              en: >-
                Designed stateful LangGraph workflows for document parsing,
                requirement extraction, compliance checking and report
                generation, with Human-in-the-loop review and
                checkpoint-based recovery.
        - heading: { zh: 个人职责与工程决策, en: Ownership and engineering decisions }
          items:
            - zh: 构建统一工具调用与安全网关，整合文档解析、OCR、敏感信息脱敏和 PDF 生成，并从代码层阻止未脱敏内容进入 LLM 与向量模型。
              en: >-
                Built a unified tool and security layer for document
                processing, OCR, data sanitization and PDF generation,
                preventing unsanitized content from reaching LLM and
                embedding services.
            - zh: 基于 PostgreSQL、pgvector 与本地 Embedding 搭建法规 RAG，实现条款检索和引用回填；使用 FastAPI、React 与 TypeScript 完成平台化，支持批量并发评审、人工决策及进度追踪。
              en: >-
                Developed regulation-focused RAG with PostgreSQL, pgvector
                and local embeddings, and productized the agent with FastAPI,
                React and TypeScript for concurrent batch review, human
                decisions and progress tracking.
        - heading: { zh: 演示、代码与相关资料, en: "Demo, code, and supporting material" }
          links:
            - url: https://github.com/FlyingJackLee/bid-agent
              label: github.com/FlyingJackLee/bid-agent

    # ───────────────────────────────── 02
    - slug: llm-gateway
      index: "02"
      category: [platform]
      kind:  { zh: 平台架构, en: Platform }
      badge: { zh: 企业安全, en: Enterprise Security }
      title: { zh: LLM 数据脱敏网关, en: LLM Data Redaction Gateway }
      blurb:
        zh: 在企业边界内完成敏感信息识别、Token 化脱敏与结果恢复，连接私有模型和 MaaS。
        en: >-
          Detects, tokenizes, and restores sensitive data inside the
          enterprise boundary while connecting private models and MaaS.
      tags: [LLM Gateway, Token Vault, MaaS]
      meta:
        org:  { zh: 系统架构设计 / 核心研发, en: System Architecture & Core Development }
        date: { zh: Release @ 2026年6月, en: Release @ June 2026 }
      case:
        - heading: { zh: 安全边界与威胁模型, en: Security boundary and threat model }
          body:
            zh: 面向企业 AI Agent 与 MaaS 调用场景的 LLM 安全接入平台，采用本地安全处理加云端推理的架构，在企业边界内完成敏感数据识别、Token 化脱敏与结果恢复，实现云端大模型的安全调用。
            en: >-
              An LLM security gateway for enterprise AI Agents and MaaS
              services, using local security processing and cloud inference
              to detect, tokenize and restore sensitive data within the
              enterprise boundary.
        - heading: { zh: 请求代理与数据恢复链路, en: Request proxy and data restoration path }
          items:
            - zh: 设计 Token Vault 并完成核心服务研发，实现敏感信息替换、映射管理、调用代理、结果恢复与访问控制。
              en: >-
                Designed the Token Vault and core services for data
                replacement, mapping, request proxying, response restoration
                and access control.
        - heading: { zh: 架构取舍与访问控制, en: Architecture trade-offs and access control }
          items:
            - zh: 负责混合架构与 LLM Gateway 核心链路设计，统一接入 AI 应用、安全策略、企业私有模型及云端 MaaS 服务。
              en: >-
                Designed the hybrid architecture and LLM Gateway for unified
                access to AI applications, security policies, private models
                and cloud MaaS services.
            - zh: 融合规则引擎、实体识别模型与本地大语言模型，实现复杂业务数据的语义识别、动态脱敏及安全校验。
              en: >-
                Combined rule engines, named entity recognition and local
                LLMs for semantic detection, dynamic sanitization and
                security validation.
        - heading: { zh: 部署形态与扩展方向, en: Deployment models and extensibility }
          # 依据「类似 APISIX 那样的网关」这一条口述整理，细节待确认
          items:
            - zh: 以独立网关进程部署在调用链路上，形态接近 APISIX：AI 应用把请求指向网关，由网关完成敏感信息识别与脱敏、转发到企业私有模型或云端 MaaS，再把结果还原后返回，调用方无需感知脱敏逻辑。
              en: >-
                Deployed as a standalone gateway process in the request path,
                in the shape of an API gateway such as APISIX: applications
                point at the gateway, which detects and tokenizes sensitive
                data, forwards to private models or cloud MaaS, and restores
                the response — callers stay unaware of the redaction layer.
            - zh: 接入新的模型供应商以增加路由配置的方式完成，调用方代码不变，安全策略与路由规则集中在网关一侧维护。
              en: >-
                Onboarding a new model provider is a routing-configuration
                change rather than a code change on the caller side; security
                policies and routing rules stay centralized in the gateway.

    # ───────────────────────────────── 03
    - slug: expert-engine
      index: "03"
      category: [agent]
      kind:  { zh: 推理引擎, en: Reasoning Engine }
      badge: { zh: 证据驱动, en: Evidence-driven }
      title: { zh: Expert Engine, en: Expert Engine }
      blurb:
        zh: 以混合检索、证据管理和可复算评分为基础，输出可解释、可追溯的研判建议。
        en: >-
          Combines hybrid retrieval, evidence management, and reproducible
          scoring for explainable, traceable recommendations.
      tags: [pgvector, OpenSearch, FastAPI]
      meta:
        org:  { zh: 系统架构设计 / 核心研发, en: System Architecture & Core Development }
        date: { zh: Release @ 2026年8月, en: Release @ August 2026 }
      case:
        - heading: { zh: 专家画像与知识组织, en: Expert profiles and knowledge organization }
          body:
            zh: 面向商务机会研判的 AI 专家引擎，基于 FastAPI、PostgreSQL、pgvector 与 OpenSearch，构建了包含 Expert Profile、Knowledge Engine、Organization Engine 等完整推理基础设施，支持从政策、新闻等事件中自动识别商机、推荐目标单位与部门、匹配公司能力并给出可解释的评分与行动建议。
            en: >-
              An AI expert engine for business opportunity intelligence,
              built with FastAPI, PostgreSQL, pgvector and OpenSearch. It
              automatically identifies opportunities from policies and news,
              recommends target organizations and departments, matches
              company capabilities, and provides explainable scores and
              actionable recommendations.
        - heading: { zh: 向量、BM25 与 SQL 混合检索, en: "Vector, BM25, and SQL hybrid retrieval" }
          items:
            - zh: 负责 Expert Engine 整体架构设计与核心模块研发，设计 Expert Profile 框架、混合检索流程（向量加 BM25 加 SQL）及证据驱动的推理管线，确保结论可解释、可追溯。
              en: >-
                Designed the overall architecture and core modules, including
                the Expert Profile framework, hybrid retrieval pipeline
                (vector + BM25 + SQL) and evidence-driven reasoning workflow
                to ensure explainability and traceability.
        - heading: { zh: 证据链与评分模型, en: Evidence chains and scoring models }
          items:
            - zh: 开发 Organization Engine、Evidence Engine、Scoring Engine 与 Need Engine，实现基于职责匹配、主题映射和历史案例的单位与部门智能推荐，统一证据管理、可复算评分模型及独立评审模块，支持证据缺失自动触发补充检索。
              en: >-
                Developed the Organization, Evidence, Scoring and Need
                Engines, implementing intelligent recommendation of
                organizations and departments based on responsibility
                matching, topic mapping and historical cases, with unified
                evidence management and reproducible scoring.
        - heading: { zh: 结构化输出与错误处理, en: Structured output and error handling }
          # 依据 github.com/FlyingJackLee/opportunity-platform 的 README 整理
          items:
            - zh: 结构化输出统一收敛到 LLM Gateway 的 structured_generate 入口，事件分析、专家研判、复核以及采集侧的相关性过滤四类任务共用同一条调用路径，模型厂商的差异被挡在网关之内。
              en: >-
                Structured output is funnelled through a single
                structured_generate entry point on the LLM Gateway, shared by
                event analysis, expert judgement, review and the collector's
                relevance filter, so provider differences stay behind the
                gateway boundary.
            - zh: 配置缺失时显式失败而不是静默降级：指定了真实厂商却没有配 API Key，应用在启动阶段直接报错退出，绝不悄悄退回 stub 实现——避免上线后拿着假数据当真结果。
              en: >-
                Misconfiguration fails loudly instead of degrading silently: if
                a real provider is selected without an API key, the application
                aborts at startup rather than quietly falling back to the stub
                implementation, so fake output can never be mistaken for real
                results in production.
            - zh: Chat 与 Embedding 独立选型（ADR-0004），因为部分厂商只提供 chat 接口而没有 embeddings 端点；pgvector 的列宽是 schema 层面的硬约束而非配置项，更换输出维度不同的 embedding 模型必须补一条 migration，这一点被写进文档以杜绝“会自动识别维度”的错误预期。
              en: >-
                Chat and embedding providers are selected independently
                (ADR-0004), since some vendors ship chat completions without an
                embeddings endpoint. The pgvector column width is a schema-level
                constraint rather than a setting: switching to a model with a
                different output dimension requires an explicit migration, and
                the docs say so to kill any expectation of auto-detection.

    # ───────────────────────────────── 04
    - slug: warehouse
      index: "04"
      category: [platform]
      kind:  { zh: 云原生, en: Cloud Native }
      badge: { zh: 全栈系统, en: Full-stack System }
      title: { zh: 智能仓储收银系统, en: Smart Warehouse & POS System }
      blurb:
        zh: 从业务一体化系统逐步演进到微服务架构，并覆盖 Web、移动端和交付流水线。
        en: >-
          Evolved an integrated business system into microservices across
          web, mobile, and delivery pipelines.
      tags: [Spring Cloud, Kubernetes, Istio, Flutter]
      meta:
        org:  { zh: 全栈开发, en: Full-stack Development }
        date: { zh: Release @ 2024年11月, en: Release @ November 2024 }
      case:
        - heading: { zh: 业务模块与系统边界, en: Business modules and system boundaries }
          body:
            zh: 面向仓储零售场景的一体化管理平台，覆盖商品库存、订单结算、收银核销及移动作业。系统由单体应用逐步演进为基于 Spring Cloud Alibaba、Kubernetes 与 Istio 的云原生微服务架构，并接入 AI Agent 实现场景化业务调度。
            en: >-
              An integrated platform for warehouse retail operations,
              covering inventory, order settlement, cashier verification and
              mobile workflows. The system evolved from a monolith into a
              cloud-native microservice architecture based on Spring Cloud
              Alibaba, Kubernetes and Istio.
          items:
            - zh: 负责前后端全栈研发及业务模块、接口与数据库设计，完成 Web 管理端和 Flutter 移动作业端，并基于 Langchain4j 接入业务智能体。
              en: >-
                Delivered full-stack development across domain, API and
                database design, built the Angular and Flutter clients, and
                integrated business agents with Langchain4j.
        - heading: { zh: 单体到微服务的演进, en: Monolith-to-microservices evolution }
          # 依据「核心系统会被非核心系统影响」这一条口述整理，
          # 具体是哪些非核心模块、各阶段的触发点待补
          items:
            - zh: 单体阶段核心的库存与收银链路和非核心功能跑在同一个进程里，非核心模块的资源占用或故障会直接波及核心交易，这是推动拆分的首要原因。
              en: >-
                In the monolith, the core inventory and checkout paths shared a
                process with non-core features, so resource pressure or failures
                in the latter propagated straight into core transactions. That
                coupling, not code size, was what forced the split.
            - zh: 因此拆分依据是故障域隔离而非代码规模：把核心交易链路与非核心功能分开部署，各自独立扩容与发布，互不牵连。
              en: >-
                The decomposition therefore followed fault-domain boundaries
                rather than module size: core transaction services and non-core
                features were deployed separately, each scaling and releasing on
                its own without dragging the other down.
        - heading: { zh: 流量治理与灰度发布, en: Traffic governance and canary delivery }
          items:
            - zh: 主导三阶段架构演进，引入分布式缓存与 Istio 服务网格，实现路由调度、流量管控、故障熔断以及金丝雀和 A/B 灰度发布。
              en: >-
                Led three phases of architectural evolution, introducing
                distributed caching and the Istio service mesh for routing,
                traffic control, circuit breaking, canary releases and A/B
                testing.
        - heading: { zh: CI/CD 与运行保障, en: CI/CD and operational reliability }
          items:
            - zh: 搭建 Jenkins 与 GitOps CI/CD 流水线，整合代码检查、镜像构建、多环境部署及版本回滚，提升交付效率并降低部署误差。
              en: >-
                Built a Jenkins and GitOps CI/CD pipeline integrating code
                checks, image builds, multi-environment deployment and
                version rollback.
          links:
            - url: https://github.com/flyingjack-cloud
              label: github.com/flyingjack-cloud

