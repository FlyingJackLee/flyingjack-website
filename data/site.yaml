  lead:
    zh: 围绕工作流、企业 AI 工程和生产交付建立完整能力闭环。
    en: >-
      A complete practice spanning workflows, enterprise AI engineering,
      and production delivery.
  items:
    - code: 01 / AGENT
      id: agent
      title: { zh: 智能体工作流, en: Agent Workflows }
      body:
        zh: 任务规划、状态管理、工具调用、记忆与上下文，以及人工复核和多智能体协作。
        en: >-
          Task planning, state, tool use, memory, context, human review,
